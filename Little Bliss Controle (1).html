<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Little Bliss Controle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Conceito: tudo redondo. Um dial central de caixa, bolhas de produto em onda, dock em pílula e folhas de oliveira nos cantos. */
:root{
  --bg:#F3EAD8; --bg2:#E9DCC2; --surface:#FCF7EC; --ink:#40291A; --ink2:#745F4C; --line:#D8C9AB;
  --olive:#566B30; --on-olive:#FCF7EC; --leaf:#8D9C5A;
  --c1:#4F8A2B; --c2:#9B4A8A;
  --good:#3F7A2C; --warn:#A8660F; --bad:#B03A2B; --sun:#C9822B; --rose:#B8506C;
  --shadow:0 12px 28px -16px rgba(64,41,26,.55);
  --display:'Cormorant Garamond','Iowan Old Style',Georgia,serif;
  --ui:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A150E; --bg2:#251E14; --surface:#2D2519; --ink:#F3E8D3; --ink2:#BCAA8E; --line:#473B2B;
    --olive:#A9BC74; --on-olive:#1A150E; --leaf:#6F7D44;
    --c1:#68A030; --c2:#B866A5;
    --good:#9CC97F; --warn:#E4B15A; --bad:#EF8C7A; --sun:#E6A04A; --rose:#E47F99;
    --shadow:0 12px 28px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A150E; --bg2:#251E14; --surface:#2D2519; --ink:#F3E8D3; --ink2:#BCAA8E; --line:#473B2B;
  --olive:#A9BC74; --on-olive:#1A150E; --leaf:#6F7D44;
  --c1:#68A030; --c2:#B866A5;
  --good:#9CC97F; --warn:#E4B15A; --bad:#EF8C7A; --sun:#E6A04A; --rose:#E47F99;
  --shadow:0 12px 28px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.4;padding-block:0 140px;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
img{display:block}
:focus-visible{outline:3px solid var(--olive);outline-offset:3px}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--ink2)}
.nums{font-variant-numeric:tabular-nums}

/* topo */
.crown{position:relative;overflow:hidden;background:var(--bg2);border-radius:0 0 46px 46px;padding-block:14px 20px;margin-bottom:20px}
.crown .wrap{position:relative;z-index:1}
.leaves{position:absolute;right:-8px;top:-8px;width:200px;color:var(--leaf);opacity:.6;pointer-events:none}
.leafbl{position:fixed;left:-40px;bottom:60px;width:200px;color:var(--leaf);opacity:.2;transform:rotate(205deg);pointer-events:none;z-index:0}
main{position:relative;z-index:1}
.brandrow{display:flex;align-items:center;gap:12px}
.logo{width:60px;height:60px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 3px var(--surface),var(--shadow)}
.brand{flex:1;min-width:0}
.brand b{display:block;font-family:var(--display);font-size:32px;line-height:1;font-weight:700;letter-spacing:-.01em}
.brand span{display:block;margin-top:4px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);font-weight:800}
.rbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);flex:none}
.rbtn svg{width:22px;height:22px}
.rbtn.go{background:var(--olive);color:var(--on-olive)}
.rbtn.flat{box-shadow:none;background:var(--bg2)}
.datebar{display:flex;align-items:center;gap:10px;margin-top:16px}
.datepill{position:relative;flex:1;min-width:0;text-align:center;background:var(--surface);border-radius:999px;padding:7px 16px;box-shadow:var(--shadow);display:grid;line-height:1.15}
.datepill .d1{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--ink2)}
.datepill .d2{font-family:var(--display);font-size:24px;font-weight:700}
.datepill input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border-radius:999px}
.banner{margin:12px 0 0;padding:8px 16px;border-radius:999px;background:var(--surface);font-weight:700;font-size:13px;text-align:center;box-shadow:inset 0 0 0 2px var(--warn);color:var(--ink)}

/* blocos */
.view{display:block}
.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--ink2)}
.sec-tag{margin:26px 0 14px}
h2.sec{font-family:var(--display);font-size:28px;font-weight:700;margin:26px 0 12px;line-height:1.1}
.card{background:var(--surface);border-radius:36px;padding:20px;box-shadow:var(--shadow)}
.empty{margin:10px 6px;color:var(--ink2);font-weight:600}
.hint{text-align:center;margin:12px 0 0;color:var(--ink2);font-weight:600;font-size:13.5px}

/* dial */
.dialwrap{display:grid;place-items:center;margin-top:4px}
.dial{position:relative;width:min(76vw,276px);aspect-ratio:1}
.dial svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:16%;gap:2px}
.mid small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--ink2)}
.mid b{font-family:var(--display);line-height:1;font-weight:700;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.mid b u{text-decoration:none;font-size:.46em;margin-right:2px;color:var(--ink2);font-family:var(--ui);font-weight:800}
.mid em{font-family:var(--display);font-style:italic;font-weight:600;font-size:17px;color:var(--ink2)}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:12px}
.lg{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--surface);font-weight:700;font-size:13px;box-shadow:var(--shadow)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.orbs{display:flex;justify-content:center;gap:10px;margin-top:16px}
.orb{width:min(30vw,114px);aspect-ratio:1;border-radius:50%;display:grid;place-content:center;text-align:center;gap:1px;background:color-mix(in srgb,var(--c) 15%,var(--surface));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 45%,transparent)}
.orb small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--ink2)}
.orb b{font-size:clamp(15px,4.4vw,19px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.orb i{font-style:normal;font-size:11px;color:var(--ink2);font-weight:700}

/* bolhas de produto */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 10px;align-items:start}
.prod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.prod:nth-child(3n+2){margin-top:22px}
.bwrap{position:relative}
.bubble{position:relative;display:block;width:min(27vw,104px);aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 4px var(--tone),0 0 0 7px var(--bg),var(--shadow);transition:transform .12s}
.bubble:active{transform:scale(.92)}
.bubble img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.count{position:absolute;top:-8px;right:-8px;min-width:34px;height:34px;padding:0 8px;border-radius:999px;background:var(--olive);color:var(--on-olive);font-weight:800;font-size:16px;display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg);font-variant-numeric:tabular-nums}
.count.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
.minus{position:absolute;left:-8px;bottom:-8px;width:34px;height:34px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 3px var(--bg),var(--shadow);display:grid;place-items:center}
.minus svg{width:18px;height:18px}
.pname{font-size:12.5px;font-weight:800;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pprice{font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--bg2);color:var(--ink2);font-variant-numeric:tabular-nums}

/* linhas em pílula */
.row{display:flex;align-items:center;gap:10px;padding:6px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);min-width:0}
.row+.row,.orderwrap+.orderwrap{margin-top:8px}
.row .rbtn{width:42px;height:42px;box-shadow:none;background:var(--bg2)}
.row .rbtn.go{background:var(--olive)}
.thumb{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none}
.thumb.ico{display:grid;place-items:center;background:var(--bg2);color:var(--ink2)}
.thumb.ico svg{width:22px;height:22px}
.rtext{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.rtext b{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtext span{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.late{font-style:normal;color:var(--bad);font-weight:800}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:4px}
.opanel{margin:6px 8px 0;padding:14px;border-radius:30px;background:var(--bg2);display:grid;gap:10px}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 10px;flex-wrap:wrap}
.dayhead .muted{font-weight:700;font-size:13px}

/* formularios */
.field{display:grid;gap:6px;margin-top:14px}
.field>span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--ink2);padding-left:16px}
input,select{font:inherit;font-size:16px;width:100%;min-height:46px;padding:0 18px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
input[type=date]{padding-right:14px}
.card input,.card select,.opanel input,.opanel select,.erow input,.erow select{background:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;background:var(--olive);color:var(--on-olive);font-weight:800;font-size:16px;width:100%;margin-top:18px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 16px;border-radius:999px;background:var(--bg2);font-weight:800;font-size:14px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--olive);color:var(--on-olive)}
.chip.danger{color:var(--bad);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--bad) 45%,transparent);background:transparent}
.stepper{display:flex;align-items:center;gap:12px}
.stepper output{min-width:36px;text-align:center;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.two{grid-template-columns:1fr}}
.seg{display:flex;padding:4px;border-radius:999px;background:var(--bg2);margin-top:22px}
.seg button{flex:1;min-height:42px;border-radius:999px;font-weight:800;color:var(--ink2)}
.seg [aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* conferencia do caixa */
.close{display:flex;gap:16px;align-items:flex-start}
.closebody{flex:1;min-width:0}
.badge{width:92px;height:92px;border-radius:50%;display:grid;place-content:center;justify-items:center;gap:2px;flex:none;font-weight:800;font-size:30px;line-height:1;color:var(--ink2);background:var(--bg2);box-shadow:inset 0 0 0 3px var(--line)}
.badge svg{width:34px;height:34px}
.badge small{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.badge.ok{color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface));box-shadow:inset 0 0 0 3px var(--good)}
.badge.diff{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,var(--surface));box-shadow:inset 0 0 0 3px var(--warn)}
@media (max-width:400px){.close{flex-direction:column;align-items:center}.closebody{width:100%}}
.msg{margin:10px 6px 0;font-weight:700;min-height:1.4em}
.expline{margin:0;font-weight:600;color:var(--ink2)}
.expline b{color:var(--ink);font-size:20px;font-variant-numeric:tabular-nums}

/* mes */
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.monthnav h2{margin:0;font-family:var(--display);font-size:32px;font-weight:700;text-transform:capitalize;text-align:center;flex:1}
.bars{display:grid;gap:3px;align-items:end;height:160px;padding:0 2px;border-bottom:2px solid var(--line)}
.bcol{height:100%;display:flex;align-items:flex-end;justify-content:center;min-width:0;border-radius:999px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;width:100%;max-width:15px;border-radius:999px;overflow:hidden}
.bar i{display:block;min-height:3px}
.bcol.sel{background:color-mix(in srgb,var(--olive) 16%,transparent)}
.blabels{display:grid;gap:3px;padding:4px 2px 0;font-size:10px;font-weight:800;color:var(--ink2);text-align:center}
.blabels span{min-width:0;overflow:visible;white-space:nowrap}
.blabels .t{color:var(--olive);text-decoration:underline;text-underline-offset:3px}
.axis{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--ink2);margin-bottom:6px;padding:0 4px}
.barinfo{margin-top:12px;padding:10px 16px;border-radius:28px;background:var(--bg2);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700;font-size:13.5px}
.meter{height:8px;border-radius:999px;background:var(--bg2);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;border-radius:999px;background:var(--tone)}
.pmid{flex:1;min-width:0}
.pmid b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pqty{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:lining-nums tabular-nums;padding-left:4px}
.pqty small{font-family:var(--ui);font-size:12px;color:var(--ink2);font-weight:800;margin-left:1px}
.drow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:6px 16px 6px 6px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:8px}
.dnum{width:48px;height:48px;border-radius:50%;display:grid;place-content:center;justify-items:center;line-height:1;font-weight:800;font-size:18px;background:var(--bg2);box-shadow:inset 0 0 0 3px var(--line);flex:none;font-variant-numeric:tabular-nums}
.dnum small{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-top:1px}
.dnum.ok{box-shadow:inset 0 0 0 3px var(--good)}
.dnum.diff{box-shadow:inset 0 0 0 3px var(--warn)}
.dmid{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.dmid b{font-variant-numeric:tabular-nums}
.dmid span{font-size:12.5px;color:var(--ink2);font-weight:600}
.dres{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.dres small{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dockpill{pointer-events:auto;display:flex;gap:2px;padding:7px;border-radius:999px;background:var(--surface);box-shadow:0 16px 34px -12px rgba(50,30,15,.6),0 0 0 2px var(--line)}
.tabbtn{display:grid;justify-items:center;gap:2px;padding:7px 12px 6px;border-radius:999px;color:var(--ink2);font-size:11px;font-weight:800;min-width:74px}
.tabbtn svg{width:24px;height:24px}
.tabbtn[aria-current="page"]{background:var(--olive);color:var(--on-olive)}

/* aviso e cardapio */
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:12px;max-width:min(92vw,520px);padding:8px 10px 8px 20px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;box-shadow:var(--shadow)}
.toast button{min-height:34px;padding:0 14px;border-radius:999px;background:var(--bg);color:var(--ink);font-weight:800}
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(30,18,8,.55)}
.sheet-card{position:relative;width:min(100%,620px);max-height:90%;overflow:auto;background:var(--bg);border-radius:44px 44px 0 0;padding-top:22px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-head h2{margin:0;font-family:var(--display);font-size:30px;font-weight:700}
.erow{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:34px;background:var(--surface);box-shadow:var(--shadow);margin-top:12px}
.erow.off{opacity:.62}
.ephoto{position:relative;width:64px;height:64px;border-radius:50%;flex:none;overflow:hidden}
.ephoto img{width:100%;height:100%;object-fit:cover}
.ephoto span{position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:800;padding:3px 0;text-align:center}
.efields{flex:1;min-width:0;display:grid;gap:8px}
.eact{display:flex;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <path id="lf" d="M0 0C8-13 30-14 46 0C30 14 8 13 0 0Z" fill="currentColor"/>
    <g id="branch">
      <path d="M196 0Q130 40 60 150" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      <use href="#lf" transform="translate(176 14) rotate(77)"/>
      <use href="#lf" transform="translate(176 14) rotate(190) scale(.8)"/>
      <use href="#lf" transform="translate(149 37) rotate(77) scale(1.05)"/>
      <use href="#lf" transform="translate(149 37) rotate(185) scale(.9)"/>
      <use href="#lf" transform="translate(122 65) rotate(77)"/>
      <use href="#lf" transform="translate(122 65) rotate(180) scale(.85)"/>
      <use href="#lf" transform="translate(95 99) rotate(80) scale(.85)"/>
      <use href="#lf" transform="translate(95 99) rotate(180) scale(.7)"/>
      <use href="#lf" transform="translate(71 133) rotate(125) scale(.8)"/>
      <use href="#lf" transform="translate(60 150) rotate(120) scale(.7)"/>
    </g>
  </defs>
</svg>

<svg class="leafbl" viewBox="0 0 200 160" aria-hidden="true"><use href="#branch"/></svg>

<header class="crown">
  <svg class="leaves" viewBox="0 0 200 160" aria-hidden="true"><use href="#branch"/></svg>
  <div class="wrap">
    <div class="brandrow">
      <img class="logo" id="logo" alt="Little Bliss">
      <div class="brand"><b>little bliss</b><span>controle de vendas</span></div>
      <button class="rbtn" data-act="openSheet" aria-label="Cardápio e preços" id="menuBtn"></button>
    </div>
    <div class="datebar" id="datebar">
      <button class="rbtn" data-act="day" data-n="-1" aria-label="Dia anterior" id="prevDay"></button>
      <label class="datepill">
        <span class="d1" id="d1"></span>
        <span class="d2" id="d2"></span>
        <input type="date" id="dateInput" aria-label="Escolher outra data">
      </label>
      <button class="rbtn" data-act="day" data-n="1" aria-label="Próximo dia" id="nextDay"></button>
    </div>
    <p class="banner" id="banner" hidden></p>
  </div>
</header>

<main class="wrap" id="main">
  <section class="view" id="v-hoje"></section>

  <section class="view" id="v-enc" hidden>
    <h2 class="sec" style="margin-top:6px">Nova encomenda</h2>
    <form class="card" id="encForm" autocomplete="off">
      <label class="field" style="margin-top:0"><span>Quem pediu</span><input id="encCliente" placeholder="Nome do cliente" maxlength="60"></label>
      <label class="field"><span>Produto</span><select id="encProd"></select></label>
      <div class="field"><span>Quantidade</span>
        <div class="stepper">
          <button type="button" class="rbtn flat" data-act="encQty" data-n="-1" aria-label="Menos um" id="encMinus"></button>
          <output id="encQty" aria-live="polite">1</output>
          <button type="button" class="rbtn flat" data-act="encQty" data-n="1" aria-label="Mais um" id="encPlus"></button>
        </div>
      </div>
      <label class="field"><span>Valor desta linha (R$)</span><input id="encTotal" inputmode="decimal" placeholder="0,00"></label>
      <button class="btn ghost" type="button" data-act="encAddLine" style="margin-top:14px">Adicionar ao pedido</button>
      <div id="encLines" aria-live="polite"></div>
      <div class="field"><span>Entrega</span>
        <div class="chips">
          <button type="button" class="chip" data-act="encQuick" data-q="amanha" aria-pressed="false">Amanhã</button>
          <button type="button" class="chip" data-act="encQuick" data-q="sex" aria-pressed="false">Sexta</button>
          <button type="button" class="chip" data-act="encQuick" data-q="sab" aria-pressed="false">Sábado</button>
        </div>
        <input type="date" id="encDate" aria-label="Data da entrega">
      </div>
      <label class="field"><span>Observação</span><input id="encObs" placeholder="Horário, endereço, recado..." maxlength="120"></label>
      <button class="btn" type="submit">Anotar encomenda</button>
    </form>
    <div class="seg" role="tablist" aria-label="Filtrar encomendas">
      <button role="tab" data-act="encFilter" data-f="pendentes" aria-selected="true" id="fPend">A entregar</button>
      <button role="tab" data-act="encFilter" data-f="entregues" aria-selected="false" id="fDone">Entregues</button>
    </div>
    <div id="encList"></div>
  </section>

  <section class="view" id="v-caixa" hidden>
    <div class="card close">
      <div id="cxBadge"></div>
      <div class="closebody">
        <p class="expline">Deveria ter <b id="cxExp">R$ 0,00</b><br><small>entrou menos o que saiu</small></p>
        <label class="field" style="margin-top:12px"><span>Quanto você contou (R$)</span><input id="cxCount" inputmode="decimal" placeholder="0,00" autocomplete="off"></label>
        <p class="msg" id="cxMsg" aria-live="polite"></p>
        <button class="btn" type="button" id="cxSave" style="margin-top:8px">Fechar o dia</button>
      </div>
    </div>
    <h2 class="sec">Anotar saída</h2>
    <form class="card" id="expForm" autocomplete="off">
      <label class="field" style="margin-top:0"><span>O que foi</span><input id="expDesc" list="expList" placeholder="Ex.: embalagens" maxlength="60"></label>
      <datalist id="expList"><option value="Ingredientes"><option value="Embalagens"><option value="Frutas e verduras"><option value="Gás"><option value="Transporte"><option value="Outros"></datalist>
      <label class="field"><span>Valor (R$)</span><input id="expVal" inputmode="decimal" placeholder="0,00"></label>
      <button class="btn" type="submit">Anotar saída</button>
    </form>
    <h2 class="sec">Extrato do dia</h2>
    <div id="cxList"></div>
  </section>

  <section class="view" id="v-mes" hidden></section>
</main>

var $=function(s,el){return (el||document).querySelector(s)};

var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parseYmd=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)};
var todayStr=function(){return ymd(new Date())};
var addDays=function(s,n){var d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
var monthOf=function(s){return s.slice(0,7)};
var addMonths=function(m,n){var p=m.split('-').map(Number);var d=new Date(p[0],p[1]-1+n,1,12);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
var loc=function(s,o){return parseYmd(s).toLocaleDateString('pt-BR',o)};
var wdShort=function(s){return loc(s,{weekday:'short'}).replace('.','')};
var dmShort=function(s){return loc(s,{day:'numeric',month:'short'}).replace(/\./g,'')};
var monthLabel=function(m){var p=m.split('-').map(Number);return new Date(p[0],p[1]-1,1,12).toLocaleDateString('pt-BR',{month:'long'})+' '+p[0]};
var num=function(c){return ((c||0)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})};
var brl=function(c){return 'R$ '+num(c)};
var sum=function(a,k){return a.reduce(function(t,x){return t+(Number(x[k])||0)},0)};
function toCents(str){
  var t=String(str==null?'':str).replace(/[^\d,.\-]/g,'').trim();
  if(!t)return NaN;
  var n;
  if(t.indexOf(',')>=0)n=parseFloat(t.replace(/\./g,'').replace(',','.'));
  else if(/^\d{1,3}(\.\d{3})+$/.test(t))n=parseFloat(t.replace(/\./g,''));
  else n=parseFloat(t);
  return isFinite(n)?Math.round(n*100):NaN;
}

  cxFor:null,cxDirty:false,pop:null,barSel:null,lastUndo:null,photoIx:null
};
var E={qty:1,manual:false,date:addDays(todayStr(),1),lines:[]};
var mi=function(pid){return S.menu.find(function(x){return x.id===pid})};

/* ---------- dados ---------- */
var subs=new Map(), loadedMonths=[];
function sub(key,q){
  if(subs.has(key)||!S.db)return;
  S.sources.set(key,new Map());
  var un=q.onSnapshot(function(snap){
    var m=new Map();
    snap.docs.forEach(function(d){var v=d.data()||{};v.id=d.id;m.set(d.id,v)});
    S.sources.set(key,m);S.loaded=true;schedule();
  },function(err){console.warn(key,err&&err.code);S.slow=true;schedule()});
  subs.set(key,un);
}
function ensureMonth(m){
  if(!S.db)return;
  if(loadedMonths.indexOf(m)<0){
    loadedMonths.push(m);
    sub('sales:'+m,S.db.collection('sales').where('ym','==',m));
    sub('orders:'+m,S.db.collection('orders').where('ym','==',m));
    sub('exp:'+m,S.db.collection('expenses').where('ym','==',m));
  }
  while(loadedMonths.length>10){
    var keep=[m,monthOf(todayStr()),monthOf(S.date),S.viewMonth];
    var old=loadedMonths.find(function(x){return keep.indexOf(x)<0});
    if(!old)break;
    loadedMonths.splice(loadedMonths.indexOf(old),1);
    ['sales:','orders:','exp:'].forEach(function(p){var k=p+old;var u=subs.get(k);if(u)u();subs.delete(k);S.sources.delete(k)});
  }
}
function collect(prefix){
  var o=new Map();
  S.sources.forEach(function(m,k){if(k.indexOf(prefix+':')===0)m.forEach(function(v,id){o.set(id,v)})});
  return Array.from(o.values());
}
function by(arr){var m=new Map();arr.forEach(function(x){var a=m.get(x.date);if(!a){a=[];m.set(x.date,a)}a.push(x)});return m}
function build(){
  var sales=collect('sales'),orders=collect('orders'),exp=collect('exp');
  return {sales:sales,orders:orders,exp:exp,sBy:by(sales),oBy:by(orders),eBy:by(exp)};
}
function day(D,d){
  var s=D.sBy.get(d)||[],os=D.oBy.get(d)||[],e=D.eBy.get(d)||[];
  var done=os.filter(function(o){return o.status==='entregue'});
  var pend=os.filter(function(o){return o.status!=='entregue'});
  var bal=sum(s,'total'),enc=sum(done,'total'),saiu=sum(e,'value');
  return {s:s,os:os,e:e,done:done,pend:pend,bal:bal,enc:enc,saiu:saiu,entrou:bal+enc,fica:bal+enc-saiu,
    items:sum(s,'qty')+sum(done,'qty'),pendTotal:sum(pend,'total'),pendQty:sum(pend,'qty')};
}
var byTs=function(a,b){return (a.ts||0)-(b.ts||0)};

function startSubs(){
  var db=S.db;
  sub('orders:pending',db.collection('orders').where('status','==','pendente'));
  ensureMonth(monthOf(todayStr()));ensureMonth(monthOf(S.date));ensureMonth(S.viewMonth);
  db.collection('closings').onSnapshot(function(snap){
    var m=new Map();snap.docs.forEach(function(d){var v=d.data()||{};v.id=d.id;m.set(d.id,v)});
    S.closings=m;S.loaded=true;schedule();
  },function(err){console.warn('closings',err&&err.code)});
  db.doc('config/menu').onSnapshot(function(snap){
    var d=snap.exists?snap.data():null;
    var items=d&&Array.isArray(d.items)&&d.items.length?d.items:null;
    if(S.sheetOpen){S.menuRemote=items||false;return}
    applyMenu(items);
  },function(err){console.warn('menu',err&&err.code)});
  setTimeout(function(){if(!S.loaded){S.slow=true;schedule()}},10000);
}
function applyMenu(items){
  S.menu=(items||DEFAULT_MENU).map(function(x){return Object.assign({},x)});
  fillProducts();schedule();
}
var menuChain=Promise.resolve();
function saveMenu(){
  fire(function(){
    menuChain=menuChain.catch(function(){}).then(function(){return S.db.doc('config/menu').set({items:S.menu,ts:Date.now()})});
    return menuChain;
  });
}

/* ---------- gravar ---------- */
var toastT=0;
function toast(msg,undo){
  var el=$('#toast');
  el.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button type="button" data-act="undo">Desfazer</button>':'');
  el.hidden=false;clearTimeout(toastT);
  toastT=setTimeout(function(){el.hidden=true},undo?5000:3400);
}
function fire(fn,msg,undo){
  if(!S.db){toast('Não consegui salvar. Abra o app logado na sua conta.');return false}
  if(!S.canWrite){toast('Você só tem acesso para ver. Peça acesso de edição.');return false}
  if(msg)toast(msg,undo);
  Promise.resolve().then(fn).catch(function(e){
    console.warn(e);
    toast(e&&e.code==='invalid_argument'?'Sem permissão para salvar. Peça acesso de edição.':'Não consegui salvar. Tente de novo.');
  });
  return true;
}
function sell(pid){
  var p=mi(pid);if(!p)return;
  var ref=S.db?S.db.collection('sales').doc():null;
  var ok=fire(function(){return ref.set({date:S.date,ym:monthOf(S.date),ts:Date.now(),pid:pid,name:p.name,qty:1,price:p.price,total:p.price})},
    '+1 '+p.name+' · '+brl(p.price),true);
  if(ok){S.lastUndo={col:'sales',id:ref.id};S.pop=pid}
}
function unsell(pid){
  var D=build();
  var list=(D.sBy.get(S.date)||[]).filter(function(s){return s.pid===pid}).sort(byTs);
  var last=list[list.length-1];if(!last)return;
  fire(function(){return S.db.collection('sales').doc(last.id).delete()},'Tirei 1 '+last.name);
}
function setDate(d){
  S.date=d;S.cxFor=null;S.cxDirty=false;S.confirmExp=null;
  ensureMonth(monthOf(d));schedule();
}

/* ---------- visual: dial ---------- */
function dial(parts,total){
  var r=100,C=2*Math.PI*r,sw=26;
  var svg='<svg viewBox="0 0 260 260" aria-hidden="true">'+
    '<circle cx="130" cy="130" r="126" fill="none" style="stroke:var(--line)" stroke-width="2.5" stroke-dasharray="0.1 9" stroke-linecap="round"/>'+
    '<circle cx="130" cy="130" r="'+r+'" fill="none" style="stroke:var(--bg2)" stroke-width="'+sw+'"/>';
  var act=parts.filter(function(p){return p.v>0});
  if(total>0&&act.length){
    var gap=act.length>1?sw+6:0,off=0;
    act.forEach(function(p){
      var len=p.v/total*C,dash=Math.max(0.5,len-gap),start=off+gap/2;
      svg+='<circle cx="130" cy="130" r="'+r+'" fill="none" style="stroke:'+p.c+'" stroke-width="'+sw+'" stroke-linecap="'+(gap?'round':'butt')+'" stroke-dasharray="'+dash.toFixed(2)+' '+(C-dash).toFixed(2)+'" stroke-dashoffset="'+(-start).toFixed(2)+'"/>';
      off+=len;
    });
  }
  return svg+'</svg>';
}
function orb(label,val,sub,c){return '<div class="orb" style="--c:'+c+'"><small>'+label+'</small><b>'+val+'</b>'+(sub?'<i>'+sub+'</i>':'')+'</div>'}
function bigMoney(c){var v=num(c);var fs=v.length<=6?50:v.length<=8?42:v.length<=10?35:30;return '<b style="font-size:'+fs+'px"><u>R$</u> '+v+'</b>'}
function legend(bal,enc){
  return '<div class="legend"><span class="lg"><i class="dot" style="--c:var(--c1)"></i>balcão '+brl(bal)+'</span><span class="lg"><i class="dot" style="--c:var(--c2)"></i>encomendas '+brl(enc)+'</span></div>';
}

/* ---------- visual: linhas ---------- */
function orderRow(o,ctx){

  var h='<div class="orderwrap"><div class="row">'+
    '<img class="thumb" src="'+photo(p||{tone:'#8D9C5A'})+'" alt="">'+
    '<div class="rtext"><b>'+esc(o.customer||'Sem nome')+'</b><span>'+(late?'<em class="late">atrasada · </em>':'')+o.qty+'× '+esc(o.name)+(o.note?' · '+esc(o.note):'')+'</span></div>'+
    '<span class="amt">'+num(o.total)+'</span>'+
    '<button class="rbtn'+(done?'':' go')+'" data-act="toggleOrder" data-id="'+esc(o.id)+'" aria-label="'+(done?'Voltar para a entregar':'Marcar como entregue')+'">'+(done?ICON.undo:ICON.check)+'</button>'+
    (ctx==='enc'?'<button class="rbtn" data-act="orderMore" data-id="'+esc(o.id)+'" aria-label="Mais opções" aria-expanded="'+open+'">'+ICON.dots+'</button>':'')+
    '</div>';
  if(open){
    h+='<div class="opanel"><label class="field" style="margin-top:0"><span>Mudar a data</span><input type="date" value="'+esc(o.date)+'" data-change="orderDate" data-id="'+esc(o.id)+'"></label>'+
      '<button class="chip danger" type="button" data-act="delOrder" data-id="'+esc(o.id)+'">'+(S.confirmDel===o.id?'Tem certeza? Apagar':'Apagar encomenda')+'</button></div>';

/* ---------- telas ---------- */

  if(x.pend.length){
    h+='<div class="tag sec-tag">Para entregar nesta data</div>';
    x.pend.slice().sort(byTs).forEach(function(o){h+=orderRow(o,'hoje')});

        (n?'<span class="count'+(S.pop===i.id?' pop':'')+'">'+n+'</span>':'')+'</button>'+

function renderEnc(D){
  $('#fPend').setAttribute('aria-selected',S.orderFilter==='pendentes');
  $('#fDone').setAttribute('aria-selected',S.orderFilter==='entregues');

  list.sort(function(a,b){return S.orderFilter==='pendentes'?(a.date===b.date?byTs(a,b):a.date<b.date?-1:1):(a.date===b.date?byTs(b,a):a.date<b.date?1:-1)});
  if(S.orderFilter==='entregues')list=list.slice(0,60);
  var h='';
  if(!list.length){
    h='<p class="empty">'+(S.orderFilter==='pendentes'?'Nenhuma encomenda para entregar. Anote a primeira no formulário acima.':'Nenhuma encomenda entregue nos meses carregados.')+'</p>';
  }else{
    var groups=[];
    list.forEach(function(o){var g=groups[groups.length-1];if(!g||g.d!==o.date){g={d:o.date,items:[]};groups.push(g)}g.items.push(o)});
    groups.forEach(function(g){
      h+='<div class="dayhead"><span class="tag">'+wdShort(g.d)+', '+dmShort(g.d)+(g.d===todayStr()?' · hoje':'')+'</span><span class="muted">'+g.items.length+(g.items.length===1?' pedido':' pedidos')+' · '+brl(sum(g.items,'total'))+'</span></div>';
      g.items.forEach(function(o){h+=orderRow(o,'enc')});
    });
  }
  $('#encList').innerHTML=h;
}

function closeView(x){
  var raw=$('#cxCount').value.trim(),c=S.closings.get(S.date);
  var counted=raw?toCents(raw):NaN,has=!isNaN(counted),exp=x.fica,state='idle',msg;
  if(!has)msg='Conte o que tem em mãos (dinheiro e Pix) e digite acima.';
  else{
    var diff=counted-exp;
    if(diff===0){state='ok';msg='Quadrou. O que você contou bate com o esperado.'}
    else{state='diff';msg=diff>0?'Sobrou '+brl(diff)+'.':'Faltou '+brl(-diff)+'.'}
  }
  if(c&&c.ts&&!S.cxDirty){var t=new Date(c.ts);msg+=' Fechado às '+pad(t.getHours())+':'+pad(t.getMinutes())+'.'}
  $('#cxBadge').innerHTML='<div class="badge '+state+'">'+(state==='ok'?ICON.check:state==='diff'?'!':'?')+'<small>'+(state==='ok'?'quadrou':state==='diff'?'confira':'contar')+'</small></div>';
  $('#cxExp').textContent=brl(exp);
  $('#cxMsg').textContent=msg;
}
function renderCaixa(D){
  var x=day(D,S.date),inp=$('#cxCount');
  if(S.cxFor!==S.date){

  }else if(!S.cxDirty){

  }

  var groups=new Map();

  x.done.slice().sort(byTs).forEach(function(o){

  h+='<div style="height:18px"></div><div class="tag">Saiu · '+brl(x.saiu)+'</div><div style="height:10px"></div>';

      '<button class="rbtn" data-act="delExp" data-id="'+esc(e.id)+'" aria-label="Apagar saída '+esc(e.desc)+'">'+(S.confirmExp===e.id?'<b style="font-size:11px">apagar?</b>':ICON.trash)+'</button></div>';
  });
  $('#cxList').innerHTML=h;

function renderMes(D){
  var m=S.viewMonth,p=m.split('-').map(Number),N=new Date(p[0],p[1],0).getDate(),today=todayStr();
  var days=[];
  for(var i=1;i<=N;i++){var d=m+'-'+pad(i);days.push(Object.assign({d:d,i:i},day(D,d)))}
  var T={bal:sum(days,'bal'),enc:sum(days,'enc'),saiu:sum(days,'saiu'),items:sum(days,'items')};
  T.entrou=T.bal+T.enc;T.fica=T.entrou-T.saiu;
  var om=D.orders.filter(function(o){return o.ym===m});
  var nDone=om.filter(function(o){return o.status==='entregue'}).length,nPend=om.length-nDone;
  var h='<div class="monthnav"><button class="rbtn" data-act="month" data-n="-1" aria-label="Mês anterior">'+ICON.chevL+'</button><h2>'+monthLabel(m)+'</h2><button class="rbtn" data-act="month" data-n="1" aria-label="Próximo mês">'+ICON.chevR+'</button></div>';
  h+='<div style="height:14px"></div><div class="dialwrap"><div class="dial">'+dial([{v:T.bal,c:'var(--c1)'},{v:T.enc,c:'var(--c2)'}],T.entrou)+
    '<div class="mid"><small>entrou no mês</small>'+bigMoney(T.entrou)+'<em>'+(T.items?T.items+(T.items===1?' item':' itens'):'nada vendido ainda')+'</em></div></div></div>';
  h+=legend(T.bal,T.enc);
  h+='<div class="orbs">'+orb('saiu',num(T.saiu),'R$','var(--rose)')+orb('fica',num(T.fica),'R$','var(--good)')+
    orb('encomendas',String(om.length),nPend?nPend+' a entregar':nDone?'todas entregues':'nenhuma','var(--sun)')+'</div>';

  /* barras por dia */
  var max=Math.max.apply(null,[1].concat(days.map(function(d){return d.entrou})));
  var sel=S.barSel&&monthOf(S.barSel)===m?S.barSel:(monthOf(today)===m?today:null);
  h+='<h2 class="sec">Entradas por dia</h2><div class="axis"><span>R$ 0</span><span>máximo '+brl(max===1&&!T.entrou?0:max)+'</span></div>';
  h+='<div class="bars" style="grid-template-columns:repeat('+N+',1fr)">';
  days.forEach(function(d){
    var ht=d.entrou?Math.max(d.entrou/max*100,5):0;
    h+='<button class="bcol'+(d.d===sel?' sel':'')+'" data-act="bar" data-d="'+d.d+'" aria-label="'+d.i+' de '+loc(d.d,{month:'long'})+': entrou '+brl(d.entrou)+', saiu '+brl(d.saiu)+'"><span class="bar" style="height:'+ht+'%">'+
      (d.enc?'<i style="flex:'+d.enc+';background:var(--c2)"></i>':'')+(d.bal?'<i style="flex:'+d.bal+';background:var(--c1)"></i>':'')+'</span></button>';
  });
  h+='</div><div class="blabels" style="grid-template-columns:repeat('+N+',1fr)" aria-hidden="true">';
  days.forEach(function(d){h+='<span'+(d.d===today?' class="t"':'')+'>'+((d.i===1||d.i%5===0||d.d===today)?d.i:'')+'</span>'});
  h+='</div>';
  var sd=sel?days.find(function(d){return d.d===sel}):null;
  h+='<div class="barinfo" aria-live="polite">';
  if(sd)h+='<span>'+wdShort(sd.d)+', '+dmShort(sd.d)+' · balcão '+brl(sd.bal)+' · encomendas '+brl(sd.enc)+' · saiu '+brl(sd.saiu)+'</span><button class="chip" data-act="openDay" data-d="'+sd.d+'">Abrir o dia</button>';
  else h+='<span>Toque numa barra para ver o dia.</span>';
  h+='</div>';

  /* por produto */
  var pm=new Map();
  var addP=function(pid,name,q,t){var g=pm.get(pid)||{pid:pid,name:name,qty:0,total:0};g.qty+=q;g.total+=t;pm.set(pid,g)};
  D.sales.filter(function(s){return s.ym===m}).forEach(function(s){addP(s.pid,s.name,s.qty||1,s.total)});
  D.orders.filter(function(o){return o.ym===m&&o.status==='entregue'}).forEach(function(o){addP(o.pid,o.name,o.qty||1,o.total)});
  var plist=Array.from(pm.values()).sort(function(a,b){return b.qty-a.qty});
  h+='<h2 class="sec">Quantos fiz de cada</h2>';
  if(!plist.length)h+='<p class="empty">Ainda não há vendas neste mês.</p>';
  var topQ=plist.length?plist[0].qty:1;
  plist.forEach(function(g){
    var it=mi(g.pid);
    h+='<div class="row" style="--tone:'+safeTone(it&&it.tone)+'"><img class="thumb" src="'+photo(it||{tone:'#8D9C5A'})+'" alt=""><div class="pmid"><b>'+esc(g.name)+'</b><div class="meter"><i style="width:'+Math.max(4,g.qty/topQ*100)+'%"></i></div></div><span class="pqty">'+g.qty+'<small>×</small></span><span class="amt">'+num(g.total)+'</span></div>';
  });

  /* dia a dia */
  var act=days.filter(function(d){return d.entrou||d.saiu||d.pend.length||S.closings.has(d.d)}).reverse();
  var okDays=act.filter(function(d){var c=S.closings.get(d.d);return c&&c.counted===d.fica}).length;
  h+='<h2 class="sec">Dia a dia</h2>';
  if(act.length)h+='<p class="muted" style="margin:-4px 6px 12px;font-weight:700">'+okDays+' de '+act.length+(act.length===1?' dia conferido e quadrado':' dias conferidos e quadrados')+'</p>';
  else h+='<p class="empty">Nenhum movimento neste mês.</p>';
  act.forEach(function(d){
    var c=S.closings.get(d.d),st=!c?'':(c.counted===d.fica?'ok':'diff');
    var stTxt=!c?'sem conferência':(st==='ok'?'quadrou':'diferença de '+brl(Math.abs(c.counted-d.fica)));
    h+='<button class="drow" data-act="openDay" data-d="'+d.d+'" aria-label="'+d.i+' de '+loc(d.d,{month:'long'})+': entrou '+brl(d.entrou)+', saiu '+brl(d.saiu)+', '+stTxt+'">'+
      '<span class="dnum '+st+'">'+d.i+'<small>'+wdShort(d.d)+'</small></span>'+
      '<span class="dmid"><b>'+brl(d.entrou)+' entrou</b><span>'+brl(d.saiu)+' saiu · '+d.items+(d.items===1?' item':' itens')+(d.pend.length?' · '+d.pendQty+' a entregar':'')+' · '+stTxt+'</span></span>'+
      '<span class="dres">'+num(d.fica)+'<small>fica</small></span></button>';
  });
  $('#v-mes').innerHTML=h;
}

/* ---------- carcaça ---------- */
function renderChrome(){
  var t=todayStr(),isT=S.date===t;
  $('#d1').textContent=loc(S.date,{weekday:'long'})+(isT?' · hoje':'');
  $('#d2').textContent=loc(S.date,{day:'numeric',month:'long'});
  if($('#dateInput').value!==S.date)$('#dateInput').value=S.date;
  $('#datebar').hidden=!(S.tab==='hoje'||S.tab==='caixa');
  ['hoje','enc','caixa','mes'].forEach(function(v){
    $('#v-'+v).hidden=S.tab!==v;
    var b=$('#t-'+v);if(S.tab===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  var b=$('#banner'),msg='';
  if(S.offline)msg='Para salvar, abra este app logado na sua conta.';
  else if(!S.canWrite)msg='Você só pode ver. Peça acesso de edição para anotar.';
  else if(S.slow&&!S.loaded)msg='Sincronizando… os números podem estar desatualizados.';
  b.textContent=msg;b.hidden=!msg;
}
var raf=0;
function schedule(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;render()})}
function render(){
  var D=build();
  renderChrome();
  if(S.tab==='hoje')renderHoje(D);
  else if(S.tab==='enc')renderEnc(D);
  else if(S.tab==='caixa')renderCaixa(D);
  else renderMes(D);
}
function setTab(t){
  S.tab=t;S.openOrder=null;S.confirmDel=null;
  if(t==='mes')ensureMonth(S.viewMonth);
  render();window.scrollTo(0,0);
}

/* ---------- encomenda: formulario ---------- */
function fillProducts(){
  var sel=$('#encProd'),cur=sel.value;
  sel.innerHTML=S.menu.filter(function(i){return !i.hidden}).map(function(i){return '<option value="'+esc(i.id)+'">'+esc(i.name)+' · '+brl(i.price)+'</option>'}).join('');
  if(cur&&mi(cur))sel.value=cur;
  encSync();
}
function encSync(){
  $('#encQty').textContent=E.qty;
  $('#encDate').value=E.date;
  var q={amanha:addDays(todayStr(),1),sex:nextDow(5),sab:nextDow(6)};
  $$('[data-q]').forEach(function(b){b.setAttribute('aria-pressed',String(E.date===q[b.dataset.q]))});
  if(!E.manual){var p=mi($('#encProd').value);$('#encTotal').value=p?num(p.price*E.qty):''}
  renderLines();
}
function renderLines(){
  var el=$('#encLines');
  if(!E.lines.length){el.innerHTML='<p class="hint" style="text-align:left;margin:10px 6px 0">Escolha o produto e toque em "Adicionar ao pedido" para colocar vários produtos na mesma encomenda.</p>';return}
  var h='<div class="dayhead" style="margin:16px 0 8px"><span class="tag">Neste pedido</span></div>';
  E.lines.forEach(function(l,ix){
    h+='<div class="row"><img class="thumb" src="'+photo(mi(l.pid)||{tone:'#8D9C5A'})+'" alt=""><div class="rtext"><b>'+l.qty+'× '+esc(l.name)+'</b><span>'+brl(l.total)+'</span></div>'+
      '<button type="button" class="rbtn" data-act="encDelLine" data-ix="'+ix+'" aria-label="Tirar '+esc(l.name)+' do pedido">'+ICON.trash+'</button></div>';
  });
  h+='<p class="expline" style="margin:12px 8px 0">Total do pedido <b>'+brl(sum(E.lines,'total'))+'</b></p>';
  el.innerHTML=h;
}
function currentLine(){
  var p=mi($('#encProd').value),tot=toCents($('#encTotal').value);
  if(!p)return {err:'Escolha o produto.'};
  if(isNaN(tot)||tot<0)return {err:'Confira o valor desta linha.'};
  return {pid:p.id,name:p.name,qty:E.qty,price:p.price,total:tot};
}

/* ---------- cardapio: editor ---------- */
function renderSheet(){
  $('#menuEdit').innerHTML=S.menu.map(function(i,ix){
    return '<div class="erow'+(i.hidden?' off':'')+'" data-ix="'+ix+'">'+
      '<button class="ephoto" type="button" data-act="pickPhoto" data-ix="'+ix+'" aria-label="Trocar a foto de '+esc(i.name)+'"><img src="'+photo(i)+'" alt=""><span>trocar</span></button>'+
      '<div class="efields"><input data-f="name" value="'+esc(i.name)+'" aria-label="Nome do produto" maxlength="40">'+
      '<div class="two"><input data-f="price" inputmode="decimal" value="'+num(i.price)+'" aria-label="Preço em reais"><select data-f="cat" aria-label="Grupo">'+
      CATS.map(function(c){return '<option value="'+c[0]+'"'+((i.cat||'outros')===c[0]?' selected':'')+'>'+c[1]+'</option>'}).join('')+'</select></div>'+
      '<div class="eact"><button class="chip" type="button" data-act="toggleHide" data-ix="'+ix+'" aria-pressed="'+(!i.hidden)+'">'+(i.hidden?'Escondido':'No cardápio')+'</button>'+
      '<button class="chip danger" type="button" data-act="delProd" data-ix="'+ix+'">'+(S.confirmProd===ix?'Apagar mesmo?':'Apagar')+'</button></div></div></div>';
  }).join('');
}
function openSheet(){S.sheetOpen=true;S.confirmProd=null;renderSheet();$('#sheet').hidden=false;document.body.style.overflow='hidden';$('#sheetCard').focus()}
function closeSheet(){
  S.sheetOpen=false;$('#sheet').hidden=true;document.body.style.overflow='';
  if(S.menuRemote!==undefined){var r=S.menuRemote;S.menuRemote=undefined;applyMenu(r||null)}else{fillProducts();schedule()}
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act,id=t.dataset.id,ix=t.dataset.ix!=null?Number(t.dataset.ix):null;
  switch(a){
    case 'tab':setTab(t.dataset.t);break;
    case 'day':setDate(addDays(S.date,Number(t.dataset.n)));break;
    case 'sell':sell(id);schedule();break;
    case 'unsell':unsell(id);break;
    case 'undo':
      if(S.lastUndo&&S.db){var u=S.lastUndo;S.lastUndo=null;S.db.collection(u.col).doc(u.id).delete().catch(function(){});$('#toast').hidden=true}
      break;
    case 'toggleOrder':{
      var o=collect('orders').find(function(x){return x.id===id});if(!o)break;
      var to=o.status==='entregue'?'pendente':'entregue';
      fire(function(){return S.db.collection('orders').doc(id).update({status:to})},to==='entregue'?'Entregue. Entrou '+brl(o.total)+' em '+dmShort(o.date):'Voltou para a entregar');
      break;}
    case 'orderMore':S.openOrder=S.openOrder===id?null:id;S.confirmDel=null;schedule();break;
    case 'delOrder':
      if(S.confirmDel===id){S.confirmDel=null;S.openOrder=null;fire(function(){return S.db.collection('orders').doc(id).delete()},'Encomenda apagada')}
      else{S.confirmDel=id;schedule()}
      break;
    case 'encFilter':S.orderFilter=t.dataset.f;schedule();break;
    case 'encAddLine':{
      var ln=currentLine();
      if(ln.err){toast(ln.err);break}
      E.lines.push(ln);E.qty=1;E.manual=false;encSync();
      toast('Adicionado: '+ln.qty+'× '+ln.name);
      break;}
    case 'encDelLine':E.lines.splice(ix,1);renderLines();break;
    case 'encQty':E.qty=Math.max(1,Math.min(99,E.qty+Number(t.dataset.n)));encSync();break;
    case 'encQuick':{E.date={amanha:addDays(todayStr(),1),sex:nextDow(5),sab:nextDow(6)}[t.dataset.q];encSync();break;}
    case 'delExp':
      if(S.confirmExp===id){S.confirmExp=null;fire(function(){return S.db.collection('expenses').doc(id).delete()},'Saída apagada')}
      else{S.confirmExp=id;schedule()}
      break;
    case 'month':S.viewMonth=addMonths(S.viewMonth,Number(t.dataset.n));S.barSel=null;ensureMonth(S.viewMonth);schedule();break;
    case 'bar':S.barSel=t.dataset.d;schedule();break;
    case 'openDay':S.date=t.dataset.d;S.cxFor=null;S.cxDirty=false;ensureMonth(monthOf(S.date));setTab('caixa');break;
    case 'openSheet':openSheet();break;
    case 'closeSheet':closeSheet();break;
    case 'addProd':
      S.menu.push({id:'p'+Date.now().toString(36),name:'Novo produto',price:1000,cat:'outros',tone:'#8D9C5A',photo:null});
      renderSheet();saveMenu();
      var rows=$$('.erow');var last=rows[rows.length-1];if(last){last.scrollIntoView({block:'center'});var f=$('[data-f="name"]',last);if(f){f.focus();f.select()}}
      break;
    case 'toggleHide':S.menu[ix].hidden=!S.menu[ix].hidden;renderSheet();saveMenu();break;
    case 'delProd':
      if(S.confirmProd===ix){S.menu.splice(ix,1);S.confirmProd=null;renderSheet();saveMenu()}
      else{S.confirmProd=ix;renderSheet()}
      break;
    case 'pickPhoto':S.photoIx=ix;$('#photoFile').click();break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='dateInput'&&t.value){setDate(t.value);return}
  if(t.dataset&&t.dataset.change==='orderDate'&&t.value){
    var id=t.dataset.id,v=t.value;
    ensureMonth(monthOf(v));
    fire(function(){return S.db.collection('orders').doc(id).update({date:v,ym:monthOf(v)})},'Data da encomenda: '+dmShort(v));
    return;
  }
  if(t.id==='encProd'||t.id==='encDate'){
    if(t.id==='encDate'&&t.value)E.date=t.value;
    if(t.id==='encProd')E.manual=false;
    encSync();return;
  }
  var row=t.closest&&t.closest('.erow');
  if(row&&t.dataset.f){
    var ix=Number(row.dataset.ix),it=S.menu[ix];if(!it)return;
    if(t.dataset.f==='name'){var nm=t.value.trim();if(!nm){t.value=it.name;return}it.name=nm}
    else if(t.dataset.f==='price'){var c=toCents(t.value);if(isNaN(c)||c<0){t.value=num(it.price);return}it.price=c;t.value=num(c)}
    else if(t.dataset.f==='cat'){it.cat=t.value}
    saveMenu();
    if(t.dataset.f==='cat')renderSheet();
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='cxCount'){S.cxDirty=true;closeView(day(build(),S.date))}
  else if(t.id==='encTotal'){E.manual=true}
});
$('#dateInput').addEventListener('click',function(){try{if(this.showPicker)this.showPicker()}catch(_){}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.sheetOpen)closeSheet()});

$('#encForm').addEventListener('submit',function(e){
  e.preventDefault();
  var cust=$('#encCliente').value.trim();
  if(!cust){toast('Coloque o nome de quem pediu.');$('#encCliente').focus();return}
  var lines=E.lines.slice();
  if(!lines.length){var cl=currentLine();if(cl.err){toast(cl.err);return}lines=[cl]}
  if(!E.date){toast('Escolha a data da entrega.');return}
  var date=E.date,note=$('#encObs').value.trim(),grp='g'+Date.now().toString(36),t0=Date.now();
  ensureMonth(monthOf(date));
  var ok=fire(function(){
    return Promise.all(lines.map(function(l,i){
      return S.db.collection('orders').add({date:date,ym:monthOf(date),ts:t0+i,grp:grp,customer:cust,pid:l.pid,name:l.name,qty:l.qty,price:l.price,total:l.total,note:note,status:'pendente'});
    }));
  },'Encomenda anotada ('+lines.length+(lines.length===1?' produto':' produtos')+') para '+wdShort(date)+', '+dmShort(date));
  if(ok){$('#encCliente').value='';$('#encObs').value='';E.lines=[];E.qty=1;E.manual=false;encSync();S.orderFilter='pendentes';schedule()}
});
$('#expForm').addEventListener('submit',function(e){
  e.preventDefault();
  var desc=$('#expDesc').value.trim(),v=toCents($('#expVal').value),date=S.date;
  if(!desc){toast('Diga o que foi a saída.');$('#expDesc').focus();return}
  if(isNaN(v)||v<=0){toast('Coloque o valor da saída.');$('#expVal').focus();return}
  var ok=fire(function(){return S.db.collection('expenses').add({date:date,ym:monthOf(date),ts:Date.now(),desc:desc,value:v})},'Saída anotada: '+desc+' · '+brl(v));
  if(ok){$('#expDesc').value='';$('#expVal').value=''}
});
$('#cxSave').addEventListener('click',function(){
  var c=toCents($('#cxCount').value),date=S.date;
  if(isNaN(c)||c<0){toast('Digite quanto você contou.');$('#cxCount').focus();return}
  var ok=fire(function(){return S.db.collection('closings').doc(date).set({date:date,counted:c,ts:Date.now()})},'Dia fechado em '+dmShort(date));
  if(ok){S.cxDirty=false}
});
$('#photoFile').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];e.target.value='';
  if(!f||S.photoIx==null)return;
  var ix=S.photoIx,rd=new FileReader();
  rd.onload=function(){
    var im=new Image();
    im.onload=function(){
      var s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=176;
      c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,176,176);
      if(S.menu[ix]){S.menu[ix].photo=c.toDataURL('image/jpeg',0.78);renderSheet();saveMenu()}
    };
    im.onerror=function(){toast('Não consegui usar essa foto.')};
    im.src=rd.result;
  };
  rd.onerror=function(){toast('Não consegui ler essa foto.')};
  rd.readAsDataURL(f);
});

/* ---------- inicio ---------- */
$('#logo').src=PHOTOS.logo;
$('#menuBtn').innerHTML=ICON.sliders;
$('#prevDay').innerHTML=ICON.chevL;$('#nextDay').innerHTML=ICON.chevR;
$('#encMinus').innerHTML=ICON.minus;$('#encPlus').innerHTML=ICON.plus;
$('#sheetClose').innerHTML=ICON.close;
$('#t-hoje').innerHTML=ICON.leaf+'<span>Hoje</span>';
$('#t-enc').innerHTML=ICON.bag+'<span>Encomendas</span>';
$('#t-caixa').innerHTML=ICON.coin+'<span>Caixa</span>';
$('#t-mes').innerHTML=ICON.ring+'<span>Mês</span>';
fillProducts();
render();
(async function(){
  try{
    var cl=window.claude;
    if(cl&&cl.use){
      S.db=await cl.use('db');
      try{
        var u=await cl.use('user');
        if(u&&typeof u.can==='function'){var w=await u.can('data.write');if(w===false)S.canWrite=false}
      }catch(_){}
    }
  }catch(_){S.db=null}
  if(!S.db){S.offline=true;render();return}
  startSubs();render();
})();
})();
</script>

</body></html>
